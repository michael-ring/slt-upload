{% extends "base.html" %}

{% block title %}Sign in · SLT Upload{% endblock %}

{% block content %}
  <div class="centered-page">
    <section class="card auth-card">
      <p class="eyebrow">SLT Upload</p>
      <h1>Upload a member image</h1>

      {% if error %}
        <p class="notice error" role="alert">{{ error }}</p>
      {% endif %}

      <a class="button discord-button" href="/auth/discord/login">Continue with Discord</a>
    </section>
  </div>
{% endblock %}
